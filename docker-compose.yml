name: ethosterra-atlas

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ethos-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    container_name: ethos-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export OLLAMA_HOST="http://ollama:11434"
        MODEL="$${MODEL_NAME:-gemma:2b}"
        echo "[Dokploy Init] Verificando presencia de modelo: $$MODEL"
        if ollama list | grep -q "$$MODEL"; then
          echo "[Dokploy Init] El modelo $$MODEL ya se encuentra disponible."
        else
          echo "[Dokploy Init] Descargando modelo $$MODEL desde Ollama library..."
          ollama pull "$$MODEL"
          echo "[Dokploy Init] Modelo $$MODEL descargado exitosamente."
        fi
    restart: "no"
    environment:
      - MODEL_NAME=${MODEL_NAME:-gemma:2b}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ethos-api
    restart: unless-stopped
    environment:
      - MODEL_PROVIDER=ollama
      - MODEL_BASE_URL=http://ollama:11434/v1/
      - MODEL_NAME=${MODEL_NAME:-gemma:2b}
      - PYTHONPATH=/app:/app/src
    ports:
      - "8000:8000"
    volumes:
      - atlas_data:/app/outputs
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ui:
    build:
      context: ./apps/ui
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/v2
    container_name: ethos-ui
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ollama_models:
  atlas_data:
