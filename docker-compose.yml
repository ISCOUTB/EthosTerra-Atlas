name: ethosterra-atlas

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      MODEL_PROVIDER: dmr
      MODEL_BASE_URL: http://ollama:11434/v1
      MODEL_NAME: gemma4:e4b
      PYTHONPATH: /app:/app/src
    expose:
      - "8000"
    volumes:
      - datos:/app/outputs
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull gemma4:e4b
        wait
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    expose:
      - "11434"
    volumes:
      - modelos:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q gemma4:e4b"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "3.00"
          memory: 4G

  ui:
    build:
      context: ./apps/ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api-atlas.${DOMINIO:-iscoutb.dev}/v2
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

volumes:
  datos:
  modelos:
