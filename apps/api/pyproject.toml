[project]
name = "prueba-llm-local"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jesus", email = "jvelandia@utb.edu.co" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
